name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run all unit tests and generate Kover coverage report
        run: ./gradlew testDebugUnitTest koverHtmlReport koverXmlReport

      - name: Parse Kover Coverage Report
        run: python3 scripts/kover_report.py

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('kover_comment.md', 'utf8');
            
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            
            const marker = '## 📊 Kover Code Coverage Report';
            const existingComment = comments.data.find(comment => comment.body.includes(marker));
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }

      - name: Upload Kover Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: composeApp/build/reports/kover/
