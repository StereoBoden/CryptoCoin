name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run all unit tests and generate Kover coverage report
        run: ./gradlew testDebugUnitTest koverHtmlReport

      - name: Upload Kover Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: composeApp/build/reports/kover/html/
