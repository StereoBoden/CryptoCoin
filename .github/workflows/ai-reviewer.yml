name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch PR Diff
        run: gh pr diff ${{ github.event.pull_request.number }} > changes.diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run AI Review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL_NAME: ${{ vars.LLM_MODEL_NAME }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: python3 .github/scripts/ai-review.py

      - name: Post Comment to PR
        if: always()
        run: |
          if [ -f review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
          else
            echo "No review.md generated, skipping comment."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
